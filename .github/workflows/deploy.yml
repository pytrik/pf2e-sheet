name: Deploy and Release

# Tag a commit `vX.Y.Z` and push the tag to trigger this:
#   git tag v0.1.0 && git push origin v0.1.0
# It builds dist/index.html, publishes it to GitHub Pages, and attaches a
# zipped release to a GitHub Release. Enable Pages (Settings > Pages > Source:
# GitHub Actions) once per repo.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            LICENSE
            README.md

      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist

      - name: Package release zip
        run: |
          mkdir -p release
          cp dist/index.html LICENSE README.md release/
          cd release
          zip ../pf2e-sheet-${{ github.ref_name }}.zip *

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: pf2e-sheet-${{ github.ref_name }}.zip
